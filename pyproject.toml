[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-usage-monitor"
version = "0.1.0"
description = "Self-hosted normalized Claude and Codex subscription usage API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[project.scripts]
ai-usage-monitor = "ai_usage_monitor.main:run"
ai-usage-monitor-secrets = "ai_usage_monitor.provision:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_usage_monitor"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
