name: Verify
on: [push, pull_request]
permissions:
  contents: read
# Separate jobs so one failing check cannot hide the others: a formatting
# failure used to stop this workflow before it built or smoke-tested the image.
jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported interpreter and the one the image runs.
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest

  lint:
    name: Lint, publication and lock checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: uvx ruff==0.17.6 check src tests scripts widgets/kwgt
      - run: uvx ruff==0.17.6 format --check src tests scripts widgets/kwgt
      - run: uv run --frozen python scripts/check_publication.py
      - name: Check the lock and the exported hash-pinned runtime requirements
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock
          git diff --exit-code -- requirements.lock

  image:
    name: Image build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: docker build -t ai-usage-monitor:patched .
      - name: Non-root, offline, read-only container smoke
        run: >-
          docker run --rm -i --network none --cap-drop ALL
          --security-opt no-new-privileges --read-only
          --tmpfs /tmp:size=64m,mode=1777
          ai-usage-monitor:patched python - < tests/container_smoke.py
      - name: Compose and mounted-secret smoke
        run: uv run --frozen python tests/compose_smoke.py
